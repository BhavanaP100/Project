<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Members | VatsalyaCare</title>
  <style>
  
     body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 50px;
            background-color: #bc29ed;
            color: white;
        }

   
        .logo {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #fffefe;
        }

        .logo img {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            border-radius: 5px;
        }
nav button {
  background-color: white;
  color: #4CAF50;
  border: none;
  padding: 10px 20px;
  margin: 0 8px;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  transition: background 0.3s, transform 0.2s;
}

nav button:hover {
  background-color: #e8f5e9;
  transform: scale(1.05);
}

    .container {
      width: 85%;
      margin: 40px auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .add-btn {
      display: block;
      margin: 0 auto 30px auto;
      background-color: #4CAF50;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      width: fit-content;
      transition: background-color 0.3s;
    }

    .add-btn:hover {
      background-color: #45a049;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 14px;
      text-align: center;
    }

    th {
      background-color: #212121;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .edit-btn, .delete-btn {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      cursor: pointer;
    }

    .edit-btn {
      background-color: #4CAF50;
      color: white;
    }

    .edit-btn:hover {
      background-color: #388E3C;
    }

    .delete-btn {
      background-color: #f44336;
      color: white;
    }

    .delete-btn:hover {
      background-color: #B71C1C;
    }

    .member-photo {
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="logo/logo.jpg" alt="Logo">
      VatsalyaCare
    </div>
    <nav>
      <button onclick="location.href='dashboard.html'">Dashboard</button>
      <button onclick="location.href='login.html'">Logout</button>
    </nav>
  </header>

  <div class="container">
    <h1>Manage Your Members</h1>
    <a class="add-btn" href="add_member.html">Add Member</a>

    <table>
      <tr>
        <th>Member ID</th>
        <th>Photo</th>
        <th>Name</th>
        <th>DOB</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
      <!-- Dynamic rows will be inserted here via JS -->
    </table>
  </div>

  <script>
    const homeId = localStorage.getItem('homeId');
    const isLoggedIn = localStorage.getItem('isLoggedIn');

    if (!isLoggedIn || !homeId) {
      window.location.href = 'login.html';
    }

    async function deleteMember(id) {
      if (confirm("Are you sure you want to delete this member?")) {
        const res = await fetch(`http://localhost:3000/api/members/${id}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        if (data.success) {
          alert("Member deleted successfully.");
          location.reload();
        } else {
          alert("Failed to delete member.");
        }
      }
    }

    function formatDOB(dateString) {
      const date = new Date(dateString);
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = String(date.getFullYear()).slice(-2);
      return `${day}-${month}-${year}`;
    }

    async function fetchMembers() {
      const res = await fetch(`http://localhost:3000/api/members?homeId=${homeId}`);
      const members = await res.json();
      const table = document.querySelector("table");

      members.forEach(member => {
        const dobFormatted = formatDOB(member.dob);

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${member.memberId}</td>
          <td><img src="${member.photoUrl}" class="member-photo" alt="Photo"></td>
          <td>${member.name}</td>
          <td>${dobFormatted}</td>
          <td>${member.age}</td>
          <td>${member.gender}</td>
          <td>${member.phone}</td>
          <td>${member.email}</td>
          <td>
            <a href="edit_member.html?id=${member._id}" class="edit-btn">Edit</a>
            <a href="#" onclick="deleteMember('${member._id}')" class="delete-btn">Delete</a>
          </td>
        `;
        table.appendChild(row);
      });
    }

    fetchMembers();
  </script>

</body>
</html>
