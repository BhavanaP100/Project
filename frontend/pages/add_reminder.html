<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Reminder | VatsalyaCare</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 400px;
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      height: 80px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }

    button:hover {
      background-color: #388E3C;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Add Reminder</h2>
    <form action="/api/reminders" method="POST">
      <label>Member ID *</label>
      <input type="text" name="memberId" required />

      <label>Title</label>
      <input type="text" name="title" placeholder="e.g., Doctor Visit" />

      <label>Description</label>
      <textarea name="description" placeholder="e.g., Checkup at City Hospital"></textarea>

      <label>Reminder Date *</label>
      <input type="date" name="reminderDate" required />

      <label>Status</label>
      <select name="status">
        <option value="Pending" selected>Pending</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
<input type="hidden" name="homeId" id="homeId" />

      <button type="submit">Add Reminder</button>
    </form>
  </div>
<script>
  const homeId = localStorage.getItem('homeId');
  if (homeId) {
    document.getElementById('homeId').value = homeId;
  } else {
    alert("Missing homeId. Please login again.");
    window.location.href = '../login.html';
  }
</script>



</body>
</html>
