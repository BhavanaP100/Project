<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Member | VatsalyaCare</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Add New Member</h2>
    <form id="addMemberForm" enctype="multipart/form-data">
      <label>Name</label>
      <input type="text" name="name" required />

      <label>Date of Birth</label>
      <input type="date" name="dob" required />

      <label>Age</label>
      <input type="number" name="age" required />

      <label>Gender</label>
      <select name="gender" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <label>Phone</label>
      <input type="text" name="phone" required />

      <label>Email</label>
      <input type="email" name="email" required />

      <label>Photo</label>
      <input type="file" name="photo" accept="image/*" />

      <button type="submit">Add Member</button>
    </form>
  </div>

  <script>
    const homeId = localStorage.getItem('homeId');
    const isLoggedIn = localStorage.getItem('isLoggedIn');

    if (!isLoggedIn || !homeId) {
      alert("Session expired. Please login again.");
      window.location.href = 'login.html';
    }

    const form = document.getElementById("addMemberForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      formData.append("homeId", homeId);

      try {
        const res = await fetch("/api/members", {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        if (data.success) {
          alert("Member added successfully!");
          window.location.href = "members.html";
        } else {
          alert(data.message || "Failed to add member.");
        }
      } catch (err) {
        console.error("Add member error:", err);
        alert("Server error while adding member.");
      }
    });
  </script>

</body>
</html>
