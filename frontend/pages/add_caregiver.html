<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Caregiver | VatsalyaCare</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 400px;
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      height: 80px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }

    button:hover {
      background-color: #388E3C;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Add New Caregiver</h2>
    <form id="caregiverForm" enctype="multipart/form-data">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required />

      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <label for="contact">Contact</label>
      <input type="text" id="contact" name="contact" autocomplete="tel" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required />

      <label for="address">Address</label>
      <textarea id="address" name="address" autocomplete="street-address" required></textarea>

      <label for="shift_time">Shift</label>
      <select id="shift_time" name="shift_time" required>
        <option value="">Select Shift</option>
        <option>Morning</option>
        <option>Evening</option>
      </select>

      <label for="shift_hour">Shift Hours</label>
      <input type="text" id="shift_hour" name="shift_hour" autocomplete="off" placeholder="e.g., 7:00 AM to 2:00 PM" required />

      <label for="assignedMembers">Assigned Member IDs</label>
      <input type="text" id="assignedMembers" name="assignedMembers" autocomplete="off" placeholder="e.g., MB001, MB002, MB003" />

      <label for="photo">Upload Photo</label>
      <input type="file" id="photo" name="photo" accept="image/*" />

      <input type="hidden" name="homeId" id="homeId" />

      <button type="submit">Add Caregiver</button>
    </form>
  </div>

  <script>
    const homeId = localStorage.getItem('homeId');
    if (!homeId) {
      alert("Missing homeId. Please login again.");
      window.location.href = '../login.html';
    }
    document.getElementById('homeId').value = homeId;

    document.getElementById('caregiverForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);

      try {
        const res = await fetch('http://localhost:3000/api/caregivers', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (data.success) {
          alert("Caregiver added successfully.");
          window.location.href = "caregiver.html";
        } else {
          alert("Failed to add caregiver: " + data.message);
        }
      } catch (err) {
        console.error("❌ POST error:", err);
        alert("Server error. Please check backend logs.");
      }
    });
  </script>

</body>
</html>
